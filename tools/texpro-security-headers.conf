# TEXPRO 安全响应头（snippet）
# 用法：在 server 级与「带 add_header 的每个 location」里 include。
# 原因：nginx 的 add_header 不继承——location 里只要出现 add_header，
#       server 级的 add_header 就全部失效。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
