# TexPro 官网 nginx 站点配置模板（静态双语站）
#
# ⚠️ 这是模板，部署到新服务器前必须替换（清单见 README.md 第四节）：
#   server_name / root / ssl_certificate / ssl_certificate_key /
#   fastcgi_pass / return 301 目标 / access_log / error_log
# 下面的 texpro.com.cn 与 www.texpro.com.cn 是现网示例值，不是通用默认值。
# 页面里的 canonical/hreflang/og:url、sitemap.xml、robots.txt 也需按目标域名同步替换。
# 备案号写在各页页脚，迁移到其他主体时按需修改。
#
# 配置要点：
#  1) 安全头抽到 /etc/nginx/snippets/texpro-security-headers.conf，并在每个
#     带 add_header 的 location 里 include —— nginx 的 add_header 不继承，
#     location 里一旦写 add_header，server 级的就会全部失效。
#  2) HTTP 与裸域 HTTPS 统一 301 → 主域（与 canonical 一致）。
#  3) /inquiry.php 仅允许 POST（后端另有 405/429/403 兜底）。
#  4) /404.html 设 internal，外部直访返回 404。

# ---- HTTP：ACME + 统一跳 https://www ----
server {
    listen 80;
    server_name texpro.com.cn www.texpro.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/texpro;
    }

    location / {
        return 301 https://www.texpro.com.cn$request_uri;
    }

    access_log /var/log/nginx/texpro.access.log;
    error_log  /var/log/nginx/texpro.error.log;
}

# ---- 裸域 HTTPS：301 → 主域（证书 SAN 需覆盖裸域） ----
server {
    listen 443 ssl http2;
    server_name texpro.com.cn;

    ssl_certificate     /etc/nginx/ssl/texpro/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/texpro/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    return 301 https://www.texpro.com.cn$request_uri;

    access_log /var/log/nginx/texpro.access.log;
    error_log  /var/log/nginx/texpro.error.log;
}

# ---- 主站 ----
server {
    listen 443 ssl http2;
    server_name www.texpro.com.cn;

    ssl_certificate     /etc/nginx/ssl/texpro/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/texpro/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/texpro;
    index index.html;

    # server 级安全头：对没有 location 级 add_header 的响应生效
    include /etc/nginx/snippets/texpro-security-headers.conf;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }

    # HTML 不缓存（资源已带 ?v= 版本号，页面结构改动即时生效）
    location ~* \.html$ {
        include /etc/nginx/snippets/texpro-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 询盘表单后端：唯一 PHP 入口，仅 POST
    location = /inquiry.php {
        if ($request_method !~ ^POST$) { return 405; }
        include /etc/nginx/snippets/texpro-security-headers.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/texpro/inquiry.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/texpro-security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.mp4$ {
        include /etc/nginx/snippets/texpro-security-headers.conf;
        expires 7d;
        add_header Accept-Ranges bytes;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/texpro-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        include /etc/nginx/snippets/texpro-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # 404 保持 404 状态码；/404.html 外部直访也返回 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/texpro.access.log;
    error_log  /var/log/nginx/texpro.error.log;
}
